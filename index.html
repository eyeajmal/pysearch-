<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PySearch - Ultra Fast Knowledge Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #080d1a 60%, #030712 100%);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-pink: #ff007f;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --card-bg: rgba(17, 24, 39, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-color: #030712;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .hero-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Top Pill Badge */
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--accent-cyan);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 24px;
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.15);
        }

        /* Gradient Logo Title */
        .brand-title {
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }

        .tagline {
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            color: var(--text-secondary);
            max-width: 440px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* Responsive Search Bar Container */
        .search-form {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 9999px;
            padding: 6px 8px 6px 20px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-form:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.35);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            padding: 8px 4px;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #00f2fe 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 9999px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.15s ease, filter 0.2s ease;
        }

        .search-btn:hover {
            filter: brightness(1.15);
            transform: scale(1.02);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        /* Suggestion Chips */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            width: 100%;
        }

        .chip {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: var(--accent-cyan);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.15);
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .search-form {
                padding: 4px 6px 4px 14px;
            }
            .search-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .chip {
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Top Feature Tag -->
        <div class="top-badge">
            ⚡ Ultra Fast Knowledge Engine
        </div>

        <!-- Main Title -->
        <h1 class="brand-title">PySearch</h1>
        <p class="tagline">Search anything across the universe. No cap, pure signal.</p>

        <!-- Search Box -->
        <form class="search-form" action="/" method="GET" id="searchForm">
            <input 
                type="text" 
                name="q" 
                id="queryInput"
                class="search-input" 
                placeholder="Search anyone (e.g. Virat Kohli)..." 
                required 
                autofocus 
                autocomplete="off"
            >
            <button type="submit" class="search-btn">
                Search 🚀
            </button>
        </form>

        <!-- Clickable Suggestion Chips -->
        <div class="chips-container">
            <button type="button" class="chip" onclick="setQuery('Virat Kohli')">🏏 Virat Kohli</button>
            <button type="button" class="chip" onclick="setQuery('Artificial Intelligence')">🤖 AI & Future</button>
            <button type="button" class="chip" onclick="setQuery('Narendra Modi')">🇮🇳 Narendra Modi</button>
            <button type="button" class="chip" onclick="setQuery('Python Programming')">🐍 Python Code</button>
            <button type="button" class="chip" onclick="setQuery('SpaceX')">🚀 SpaceX</button>
        </div>
    </div>

    <script>
        function setQuery(term) {
            const input = document.getElementById('queryInput');
            input.value = term;
            document.getElementById('searchForm').submit();
        }
    </script>

</body>
</html>
